<Base · HTML
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard AI — Real-Time Threat Mitigator</title>

    <!-- Correct Tailwind CDN (the previous src="https://tailwindcss.com" pointed at the
         marketing site, not the build, so no utility classes were ever applying) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #070a12;
            --panel: #0d1220;
            --panel-2: #0a0f1a;
            --line: #1c2740;
            --cyan: #4ce0ff;
            --magenta: #ff3d7f;
            --green: #3dffa6;
            --amber: #ffb14c;
            --text: #d7e1f2;
            --muted: #5c6b8a;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Chakra Petch', sans-serif;
            background-image:
                repeating-linear-gradient(0deg, rgba(76,224,255,0.035) 0px, rgba(76,224,255,0.035) 1px, transparent 1px, transparent 24px),
                repeating-linear-gradient(90deg, rgba(76,224,255,0.035) 0px, rgba(76,224,255,0.035) 1px, transparent 1px, transparent 24px);
        }

        header {
            background-color: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        .pg-mono { font-family: 'JetBrains Mono', monospace; }

        .pg-brand {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: #f2f6ff;
            text-shadow: 0 0 14px rgba(76,224,255,0.3);
        }
        .pg-brand span.hl { color: var(--cyan); }

        .pg-tagline {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.04em;
            color: var(--cyan);
            background: rgba(76,224,255,0.08);
            padding: 0.25rem 0.55rem;
            border-radius: 2px;
            border: 1px solid rgba(76,224,255,0.25);
            margin-left: 0.6rem;
        }

        .pg-status-bar {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--muted);
            background-color: var(--panel-2);
            padding: 0.5rem 0.85rem;
            border-radius: 3px;
            border: 1px solid var(--line);
        }

        .pg-status-dot {
            color: var(--green);
            font-weight: bold;
            animation: pg-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pg-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        footer {
            border-top: 1px solid var(--line);
            background-color: var(--bg);
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
        }

        /* Generic card class kept for any page still using it */
        .card-panel {
            background-color: var(--panel);
            border: 1px solid var(--line);
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="w-full">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center flex-wrap gap-3">
            <div class="flex items-center">
                <h1 class="pg-brand flex items-center">
                    PHISH<span class="hl">GUARD</span>
                    <span class="pg-tagline">GUARDING YOU TO SAFE SURFING</span>
                </h1>
            </div>
            <div class="pg-status-bar">
                SYSTEM STATUS: <span class="pg-status-dot">● ACTIVE SECURE RUNTIME</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center py-6">
        PhishGuard AI Solo Edition &copy; 2026
    </footer>

</body>
</html>
